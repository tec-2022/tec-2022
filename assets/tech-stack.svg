      <rect x="118" width="104" height="40" rx="13" fill="#111827" stroke="#F8FAFC"/><text class="chipText" x="139" y="27">Next.js</text>
      <rect x="236" width="80" height="40" rx="13" fill="#312E81" stroke="#A78BFA"/><text class="chipText" x="259" y="27">Vite</text>
