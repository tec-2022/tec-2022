<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="tech-title tech-desc">
  <title id="tech-title">Stack de Fredy Vidalón</title>
  <desc id="tech-desc">Tecnologías: TypeScript, JavaScript, C#/.NET, Python, Go, HTML5, CSS3, SQL, React, Next.js, Vite, Tailwind CSS, Node.js, Supabase, Prisma, PostgreSQL, Docker, Vercel, OpenAI/Astra, APIs, Recharts y Lucide.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.45" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <style>
      .label { font: 800 16px 'Segoe UI', Arial, sans-serif; letter-spacing: 2px; fill: #E5F2FF; }
      .chipText { font: 800 18px 'Segoe UI', Arial, sans-serif; fill: #F8FAFC; }
      .sub { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #94A3B8; }
    </style>
  </defs>
  <rect width="1200" height="340" rx="26" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="338" rx="25" fill="none" stroke="#263449"/>
  <circle cx="1030" cy="40" r="150" fill="#2563EB" opacity="0.18"/>
  <circle cx="130" cy="325" r="180" fill="#7C3AED" opacity="0.18"/>
  <rect x="54" y="52" width="1092" height="3" rx="2" fill="url(#line)"/>

  <g transform="translate(54 28)">
    <text class="label" x="0" y="0">STACK REAL DETECTADO</text>
    <text class="sub" x="0" y="44">Lenguajes · frontend · backend · cloud · IA aplicada</text>
  </g>

