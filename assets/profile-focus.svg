<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="focus-title focus-desc">
  <title id="focus-title">Áreas de enfoque de Fredy Vidalón</title>
  <desc id="focus-desc">Tres tarjetas visuales sobre desarrollo web, información organizada e inteligencia artificial aplicada.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#0A1020"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#page)"/>
  <rect x="1" y="1" width="1198" height="428" rx="23" fill="none" stroke="#263449"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="60" y="64" fill="#F8FAFC" font-size="36" font-weight="800">Lo que me gusta construir</text>
    <text x="60" y="102" fill="#9FB2C7" font-size="21">Soluciones claras, útiles y listas para crecer.</text>

    <g transform="translate(60 140)">
      <rect width="330" height="220" rx="18" fill="#111B2D" stroke="#26405D"/>
      <circle cx="58" cy="58" r="30" fill="url(#blue)" opacity="0.95"/>
      <path d="M47 58l17-17M47 58l17 17M80 41l-15 34" stroke="#EFF6FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="34" y="118" fill="#F8FAFC" font-size="28" font-weight="800">Desarrollo web</text>
      <text x="34" y="154" fill="#AFC1D5" font-size="19">Aplicaciones modernas con</text>
      <text x="34" y="181" fill="#AFC1D5" font-size="19">interfaces limpias y rápidas.</text>
    </g>

    <g transform="translate(435 140)">
      <rect width="330" height="220" rx="18" fill="#111B2D" stroke="#26405D"/>
      <circle cx="58" cy="58" r="30" fill="url(#green)" opacity="0.95"/>
      <path d="M42 50h32M42 62h32M42 74h22" stroke="#ECFDF5" stroke-width="6" stroke-linecap="round"/>
      <text x="34" y="118" fill="#F8FAFC" font-size="28" font-weight="800">Información</text>
      <text x="34" y="154" fill="#AFC1D5" font-size="19">Datos ordenados para</text>
      <text x="34" y="181" fill="#AFC1D5" font-size="19">consultar y decidir mejor.</text>
    </g>

    <g transform="translate(810 140)">
      <rect width="330" height="220" rx="18" fill="#111B2D" stroke="#26405D"/>
      <circle cx="58" cy="58" r="30" fill="url(#gold)" opacity="0.95"/>
      <path d="M58 35v46M35 58h46M43 43l30 30M73 43L43 73" stroke="#FFF7ED" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
      <text x="34" y="118" fill="#F8FAFC" font-size="28" font-weight="800">IA aplicada</text>
      <text x="34" y="154" fill="#AFC1D5" font-size="19">Integraciones inteligentes</text>
      <text x="34" y="181" fill="#AFC1D5" font-size="19">para automatizar trabajo.</text>
    </g>

    <text x="60" y="398" fill="#7F92A8" font-size="18">Tijuana, Baja California · Ingeniería Informática · @tec-2022</text>
  </g>
</svg>
